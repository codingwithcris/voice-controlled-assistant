[project]
name = "voice-controlled-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cristopher Navarro", email = "codingwithcris@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.0",
    "pyaudio>=0.2.14",
    "python-dotenvx>=2.0.1",
    "pyttsx3>=2.99",
    "speechrecognition>=3.17.0",
]

[project.scripts]
voice-controlled-assistant = "voice_controlled_assistant:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
